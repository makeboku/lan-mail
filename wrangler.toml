name = "myou-mail"
main = "worker/src/index.ts"

# 打包配置
minify = true
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2025-03-01"
keep_vars = true

# 启用 D1 数据库
# 注意：Wrangler 不支持 ${VAR} 变量插值，写成 ${D1_DATABASE_ID} 会被当成普通字符串，导致部署失败。
# - 网页一键部署：Cloudflare 会自动创建 D1，并用真实名称/ID 覆盖下面两项。
# - 命令行部署：先执行 `wrangler d1 create 你的库名`，再把返回的 database_name / database_id 填到这里。
[[d1_databases]]
binding = "DB"
database_name = "miaoyou"
database_id = "e77efb4a-e91d-4b6a-9535-52837bf07d43"

# 设置域名
[vars]
VITE_EMAIL_DOMAIN = "example.com,another.com"
VITE_EXTERNAL_LINKS = "临时Gmail邮箱1|https://smailpro.com/temporary-email,临时Gmail邮箱2|https://temp.tf"
# VITE_EXTERNAL_LINKS 也可以在 Cloudflare Dashboard → Workers → 环境变量中覆盖
# 格式：标签|URL,标签|URL

# D1 敏感字段加密：以下密钥不要写在本文件，使用 Secret 注入：
#   wrangler secret put MAIL_ENCRYPTION_KEY   # 加密主密钥（>=16 字符，丢失后数据无法恢复）
#   wrangler secret put MIGRATION_SECRET      # 历史数据加密迁移接口密钥
# 未配置 MAIL_ENCRYPTION_KEY 时，程序保持原行为（明文写入），不会报错。

# 配置邮件处理
[triggers]
crons = ["0 * * * *"]

[build]
command = "pnpm run build"

[assets]
binding = "ASSETS"
directory = "frontend/dist"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[observability]
enabled = false
head_sampling_rate = 1
